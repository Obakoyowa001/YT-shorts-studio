name: Publish video as release

# Attach a finished render's video to a GitHub Release (one-tap .mp4 download, no sign-in).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the render run whose video to publish"
        required: true
      short:
        description: "Short name, e.g. s002"
        default: "s002"
      title:
        description: "Release title"
        default: "What If Everyone Printed Money?"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.short }}-video
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(ls video/*.mp4 | head -1)
          tag="${{ inputs.short }}-$(date -u +%Y%m%d-%H%M)"
          mv "$f" "video/${{ inputs.short }}-ask-gus-4k.mp4"
          gh release create "$tag" "video/${{ inputs.short }}-ask-gus-4k.mp4" \
            --repo "$GITHUB_REPOSITORY" --title "${{ inputs.short }}: ${{ inputs.title }}" \
            --notes "Ask Gus Short ${{ inputs.short }} — 2160x3840, rendered by run ${{ inputs.run_id }}. Tap the .mp4 below to download."
