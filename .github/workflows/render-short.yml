name: Render Short

# 4K (2160x3840) at 60 fps by default. Put "[preview]" in the commit message (or tick
# "preview" when running manually) for a fast 540x960 / 30 fps check render.
on:
  workflow_dispatch:
    inputs:
      short:
        description: "Short module to render (render/shorts/<name>.py)"
        default: "s001"
      preview:
        description: "Quick 540x960 30fps preview instead of 4K60"
        type: boolean
        default: false
  push:
    paths:
      - "render/engine.py"
      - "render/shorts/s001.py"
      - ".github/workflows/render-short.yml"

env:
  SHORT: ${{ inputs.short || 's001' }}
  PREVIEW: ${{ inputs.preview == true || contains(github.event.head_commit.message, '[preview]') }}
  SHARDS: 8

jobs:
  prep:
    name: Voice, sound mix and shot plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config
      - name: Python packages and assets
        run: |
          pip install -r render/requirements.txt
          bash render/fetch_assets.sh all
      - name: Prep
        run: |
          if [ "$PREVIEW" = "true" ]; then W=540; H=960; FPS=30; else W=2160; H=3840; FPS=60; fi
          python render/render.py prep --short "$SHORT" --width $W --height $H --fps $FPS \
            --shards $SHARDS --work out/work
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            out/work/plan.json
            out/work/mix.wav
          retention-days: 3

  shots:
    name: Render shard ${{ matrix.shard }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config
      - name: Python packages and fonts
        run: |
          pip install pillow==11.0.0 numpy==2.1.3 pycairo==1.27.0
          bash render/fetch_assets.sh fonts
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out/work
      - name: Render shots
        run: python render/render.py shots --shard ${{ matrix.shard }} --work out/work
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: out/work/shot*.mp4
          compression-level: 0
          retention-days: 3

  assemble:
    name: Assemble video
    needs: shots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install numpy==2.1.3
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out/work
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: out/work
      - name: Assemble
        run: |
          if [ "$PREVIEW" = "true" ]; then NAME="${SHORT}_preview"; else NAME="${SHORT}_4k60"; fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          python render/render.py assemble --work out/work --out "out/$NAME.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size \
            -of default=nw=1 "out/$NAME.mp4"
      - name: Small preview + frame sheet
        run: |
          ffmpeg -v error -y -i "out/$NAME.mp4" -vf "fps=1/2.5,scale=270:-1,tile=7x4" -frames:v 1 out/frames.jpg
          ffmpeg -v error -y -i "out/$NAME.mp4" -vf "scale=540:960,fps=30" -c:v libx264 -crf 28 \
            -preset veryfast -c:a aac -b:a 96k out/preview_540p.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHORT }}-video
          path: out/${{ env.NAME }}.mp4
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHORT }}-preview
          path: |
            out/frames.jpg
            out/preview_540p.mp4
          retention-days: 30
